name: Proposal
description: Work that changes product behaviour, interfaces, architecture, platforms or direction. Needs product-owner approval before implementation.
title: "Proposal: "
labels: ["type:proposal", "status:proposed", "authority:propose-first"]
body:
  - type: input
    id: owner-summary
    attributes:
      label: Owner summary
      description: One plain-English sentence for the product owner, phrased as the question they are being asked. Used verbatim in their notification.
    validations:
      required: true
  - type: input
    id: why-it-matters
    attributes:
      label: Why it matters
      description: "One plain sentence on why this needs a decision now, or at all."
    validations:
      required: true
  - type: input
    id: owner-recommendation
    attributes:
      label: Owner recommendation
      description: "One plain sentence with the single recommended answer. Detail and alternatives go further down."
    validations:
      required: true
  - type: input
    id: urgency
    attributes:
      label: Urgency
      description: "Can wait, or the date by which it matters and why. Left empty, the notification says Can wait."
    validations:
      required: false
  - type: input
    id: if-nothing-is-done
    attributes:
      label: If nothing is done
      description: "One plain sentence on what happens if the owner does not answer."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What was verified, where (file, line, source URL, date). Facts only.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The specific change proposed, and the alternatives rejected.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Who benefits and how much.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, effort and repositories
      description: Approximate size and every repository that changes. Say which other products are affected and how compatibility will be validated.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and reversal
      description: What could break, how it is validated, how it is reversed.
    validations:
      required: true
  - type: textarea
    id: category
    attributes:
      label: Category check
      description: Why this is not AUTONOMOUS and not HUMAN AUTHORITY.
    validations:
      required: true
